<style>

.hero .en{direction:ltr;font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:25px;color:var(--rasp)}

.cat{border-radius:28px;padding:18px 14px 14px;margin:16px 0;background:var(--pis)}
.cat:nth-child(4n+2){background:var(--apr)}
.cat:nth-child(4n+3){background:var(--lil)}
.cat:nth-child(4n+4){background:var(--pink)}

.item{background:#fff;border-radius:18px;padding:12px 13px;box-shadow:0 6px 14px -10px rgba(75,42,61,.4);min-height:96px}
.info{display:flex;flex-direction:column;align-items:flex-start}
.row{display:contents}
.lead{display:none}
.name{order:1;font-weight:700;line-height:1.35}
.desc{order:2;font-size:13px;opacity:.7;margin-top:2px;line-height:1.4}
.price{order:3;margin-top:auto;padding-top:6px;color:var(--rasp);font-weight:800}
.price b{background:#fdeef1;border-radius:99px;padding:1px 10px}
.price i{font-size:.75em;font-weight:700;margin-inline-start:2px}
.pic{margin:-4px -5px 4px}
.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.item:has(.pic){flex-direction:column}
.badge{display:inline-block;background:var(--ink);color:#fff;border-radius:99px;padding:0 9px;font-size:12px;margin-inline-start:6px;vertical-align:middle}
.soldout{opacity:.6}
.soldout .price b{text-decoration:line-through}

<script>
(function(){
var C=JSON.parse(document.getElementById('tt-config').textContent);
var G='https://docs.google.com/spreadsheets/d/'+C.sheetId;
var CFG={id:C.id,sources:[G+'/gviz/tq?tqx=out:csv&gid='+C.gid,G+'/export?format=csv&gid='+C.gid]}, FALLBACK=C.fallback||[];
var $=function(s){return document.querySelector(s)};
(function(){var h=$('.hero h1'),e=$('.hero .en'),s=$('.hero .sub');
  if(C.ar&&h)h.textContent=C.ar;if(C.en&&e)e.textContent=C.en;if(s)s.textContent=C.tag||'';
  if(C.ar)document.title=C.ar+(C.en?' | '+C.en:'')})();
function norm(s){return s==null?'':String(s).trim()}
function parseCSV(t){var rows=[],r=[],f='',q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==','){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
function toNum(s){s=norm(s).replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[^\d.]/g,'');return s===''?null:Number(s)}
function rowsToMenu(rows){
  if(!rows.length)return[];
  var H=rows[0].map(norm);
  if(H.indexOf('\u0627\u0644\u0635\u0646\u0641')<0)return[];
  function ix(n){return H.indexOf(n)}
  var c=ix('\u0627\u0644\u0641\u0626\u0629'),n=ix('\u0627\u0644\u0635\u0646\u0641'),p=ix('\u0627\u0644\u0633\u0639\u0631'),a=ix('\u0645\u062a\u0648\u0641\u0631'),d=ix('\u0627\u0644\u0648\u0635\u0641'),ph=ix('\u0635\u0648\u0631\u0629');
  var cats=[],cur=null;
  rows.slice(1).forEach(function(r){
    var name=norm(r[n]);if(!name)return;
    var cn=(c>=0&&norm(r[c]))||(cur?cur.name:'\u0627\u0644\u0642\u0627\u0626\u0645\u0629');
    if(!cur||cur.name!==cn){cur=cats.filter(function(x){return x.name===cn})[0];if(!cur){cur={name:cn,items:[]};cats.push(cur)}}
    var av=!/^(\u0644\u0627|no|n|0|false|x)$/i.test(norm(a>=0?r[a]:''));
    cur.items.push({name:name,price:p>=0?toNum(r[p]):null,avail:av,desc:d>=0?norm(r[d]):'',photo:ph>=0?norm(r[ph]):''})});
  return cats}
function fromFallback(){return FALLBACK.length?rowsToMenu([['\u0627\u0644\u0641\u0626\u0629','\u0627\u0644\u0635\u0646\u0641','\u0627\u0644\u0633\u0639\u0631','\u0645\u062a\u0648\u0641\u0631','\u0627\u0644\u0648\u0635\u0641','\u0635\u0648\u0631\u0629']].concat(FALLBACK)):[]}
var EMO=/^(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*)\s*/u;
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
var last='',rendered=false,io=null;
function message(t){var nav=$('#nav'),main=$('#menu');nav.textContent='';main.textContent='';main.appendChild(el('p','empty',t))}
function render(menu){
  var nav=$('#nav'),main=$('#menu');nav.textContent='';main.textContent='';
  if(io)io.disconnect();
  if(!menu.length){message('\u0644\u0627 \u062a\u0648\u062c\u062f \u0623\u0635\u0646\u0627\u0641 \u0628\u0639\u062f');return}
  var secs=[];
  menu.forEach(function(cat,i){
    var m=cat.name.match(EMO),emo=m?m[1]:'',title=m?cat.name.slice(m[0].length):cat.name;
    var a=el('a','',title);a.href='#c'+i;a.dataset.i=i;nav.appendChild(a);
    var sec=el('section','cat');sec.id='c'+i;
    var h=el('h2');if(emo){var e=el('span','emo',emo);e.setAttribute('aria-hidden','true');h.appendChild(e)}h.appendChild(el('span','t',title));sec.appendChild(h);
    var ul=el('ul','items');
    cat.items.forEach(function(it){
      var li=el('li','item'+(it.avail?'':' soldout'));
      if(/^https?:\/\//i.test(it.photo)){var pic=el('div','pic'),im=document.createElement('img');im.src=it.photo;im.alt='';im.loading='lazy';im.onerror=function(){pic.remove()};pic.appendChild(im);li.appendChild(pic)}
      var info=el('div','info'),row=el('div','row'),nm=el('span','name',it.name);
      if(!it.avail)nm.appendChild(el('span','badge','\u0646\u0641\u062f'));
      row.appendChild(nm);row.appendChild(el('span','lead'));
      if(it.price!=null){var pr=el('span','price');pr.appendChild(el('b','',it.price.toLocaleString('en-US')));pr.appendChild(document.createTextNode(' '));pr.appendChild(el('i','','\u0644.\u0633'));row.appendChild(pr)}
      info.appendChild(row);if(it.desc)info.appendChild(el('p','desc',it.desc));
      li.appendChild(info);ul.appendChild(li)});
    sec.appendChild(ul);main.appendChild(sec);secs.push(sec)});
  if('IntersectionObserver' in window){
    io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){
      var links=nav.children;for(var k=0;k<links.length;k++)links[k].classList.toggle('on',links[k].dataset.i===en.target.id.slice(1));
      var on=nav.querySelector('.on');if(on&&nav.scrollWidth>nav.clientWidth){var nb=nav.getBoundingClientRect(),ob=on.getBoundingClientRect();nav.scrollTo({left:nav.scrollLeft+(ob.left-nb.left)-nb.width/2+ob.width/2,behavior:'smooth'})}}})},{rootMargin:'-25% 0px -65% 0px'});
    secs.forEach(function(s){io.observe(s)})}
  var first=nav.firstChild;if(first)first.classList.add('on')}
function commit(menu,live){
  var s=JSON.stringify(menu);
  if(s!==last){last=s;render(menu);rendered=true}
  if(live){try{localStorage.setItem('tt:'+CFG.id,s)}catch(e){}
    var d=new Date();$('#upd').textContent='\u0622\u062e\u0631 \u062a\u062d\u062f\u064a\u062b: '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}}
function cached(){try{var s=localStorage.getItem('tt:'+CFG.id);return s?JSON.parse(s):null}catch(e){return null}}
function fetchText(u){var ctl=window.AbortController?new AbortController():null,t=setTimeout(function(){ctl&&ctl.abort()},8000);
  return fetch(u+(u.indexOf('?')>-1?'&':'?')+'_='+Date.now(),{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){clearTimeout(t);if(!r.ok)throw 0;return r.text()},function(e){clearTimeout(t);throw e})}
function refresh(){
  return CFG.sources.reduce(function(p,u){return p.then(function(ok){if(ok)return true;
    return fetchText(u).then(function(t){var m=rowsToMenu(parseCSV(t));if(m.length){commit(m,true);return true}return false},function(){return false})})},Promise.resolve(false))}
var start=cached()||fromFallback();if(start.length)commit(start,false);
refresh().then(function(ok){if(!ok&&!rendered)message('\u062a\u0639\u0630\u0651\u0631 \u062a\u062d\u0645\u064a\u0644 \u0627\u0644\u0642\u0627\u0626\u0645\u0629. \u062d\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062e\u0631\u0649 \u0628\u0639\u062f \u0642\u0644\u064a\u0644.')});
setInterval(function(){if(!document.hidden)refresh()},45000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh()});
})();
</script>
